<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikhtebar Appreciation Post Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Uploaded Fonts */
        @font-face {
            font-family: 'Kanz al Marjaan';
            src: url('Kanz-al-Marjaan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Al-Kanz for Windows';
            src: url('Al-Kanz for Windows.ttf') format('truetype');
        }

        :root { --primary: #1a5276; --gold: #d4af37; --bg: #1a1a2e; }
        body { font-family: 'Amiri', serif; background: var(--bg); color: #ecf0f1; margin: 0; padding: 20px; display: flex; flex-direction: row-reverse; gap: 30px; justify-content: center; }
        
        .editor-panel { background: #ffffff; color: #2c3e50; padding: 25px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 8px solid var(--gold); height: 95vh; overflow-y: auto; text-align: left; }
        h2 { font-family: 'Aref Ruqaa', serif; text-align: left; color: var(--primary); margin-top: 0; }
        .field { margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: #34495e; text-align: left; }
        
        input[type="text"], select, input[type="file"], input[type="range"], input[type="color"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #bdc3c7; box-sizing: border-box; font-family: 'Amiri'; font-size: 1em; }
        input[type="color"] { height: 45px; cursor: pointer; padding: 2px; }
        .preview-container { text-align: center; position: sticky; top: 20px; }
        canvas { border: 10px solid #fff; box-shadow: 0 15px 45px rgba(0,0,0,0.4); max-width: 500px; height: auto; background: #fff; border-radius: 4px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Aref Ruqaa'; font-weight: bold; background: #27ae60; color: white; font-size: 1.2em; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #219150; }
        @media (max-width: 900px) { body { flex-direction: column; align-items: center; } .editor-panel { width: 90%; height: auto; } }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h2>Ikhtebaar Appreciation Post</h2>
        
        <div class="field">
            <label>1. Select Marhala Name (Ribbon)</label>
            <select id="marhalaName">
                <option value="">-- Select Marhala --</option>
                <option value="المرحلة الاولى">المرحلة الاولى</option>
                <option value="المرحلة الثانية">المرحلة الثانية</option>
                <option value="المرحلة الثالثة">المرحلة الثالثة</option>
                <option value="المرحلة الرابعة">المرحلة الرابعة</option>
                <option value="المرحلة الخامسة">المرحلة الخامسة</option>
                <option value="المرحلة السادسة">المرحلة السادسة</option>
                <option value="المرحلة السابعة">المرحلة السابعة</option>
                <option value="المرحلة الثامنة">المرحلة الثامنة</option>
                <option value="اختبار نهائي">اختبار نهائي</option>
            </select>
            <label style="font-size: 0.75em; margin-top:8px;">Marhala Ribbon Text Color</label>
            <input type="color" id="marhalaColor" value="#b02a2a">
        </div>

        <div class="field">
            <label>2. Typography & Color (Student Info)</label>
            <select id="fontSelect">
                <option value="Amiri">Amiri (Default)</option>
                <option value="Aref Ruqaa">Aref Ruqaa</option>
                <option value="Scheherazade New">Scheherazade New</option>
                <option value="Al-Kanz for Windows">Al-Kanz</option>
                <option value="Kanz al Marjaan">Kanz al Marjaan</option>
            </select>
            <label style="font-size: 0.75em; margin-top:8px;">Student Info Text Color</label>
            <input type="color" id="nameColor" value="#8b1e1e">
        </div>

        <div class="field">
            <label>3. Student Details</label>
            <input type="text" id="stdFullName" placeholder="اسم الطالب الكامل (e.g. سيف الدين بهائي...)">
            <input type="text" id="darajahName" placeholder="الدرجة (e.g. الدرجة السادسة)">
            <input type="text" id="schoolName" placeholder="اسم المدرسة (e.g. سيفية بوئز هائي اسكول)">
        </div>

        <div class="field">
            <label>4. Marhala Counts (Bottom)</label>
            <input type="text" id="marhalaCount" placeholder="Marhala Count (e.g. 1)">
            <input type="text" id="totalMarhalaCount" placeholder="Total Count (e.g. 8)">
        </div>

        <div class="field">
            <label>5. Photo Controls</label>
            <input type="file" id="studentUpload" accept="image/*">
            <label style="font-size:0.7em; margin-top:5px;">Zoom</label>
            <input type="range" id="photoZoom" min="0.5" max="3.0" step="0.1" value="1">
            <label style="font-size:0.7em; margin-top:5px;">Vertical Position</label>
            <input type="range" id="photoYOffset" min="-500" max="500" value="0">
        </div>

        <button onclick="download()">Download PNG</button>
    </div>

    <div class="preview-container">
        <!-- Canvas dimensions matching template base size -->
        <canvas id="canvas" width="1224" height="1776"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = new Image();
        let studentImage = null;

        // Exact Coordinates mapped to your template layout
        const POS = {
            photo: { x: 500, y: 350, radius: 155 },                 // Circular photo frame
            stdFullName: { x: 500, y: 535, maxWidth: 600 },          // Line 1: Full name inside central box
            darajahName: { x: 500, y: 585, maxWidth: 600 },          // Line 2: Darajah inside central box
            schoolName: { x: 500, y: 630, maxWidth: 600 },           // Line 3: School inside central box
            marhalaName: { x: 500, y: 700, maxWidth: 500 },          // Inside ribbon box
            marhalaCount: { x: 140, y: 1615 },                       // Bottom-left counter
            totalCount: { x: 860, y: 1615 }                          // Bottom-right counter
        };

        const staticFont = "Kanz al Marjaan";

        const controls = [
            'marhalaName', 'marhalaColor', 'fontSelect', 'nameColor', 
            'stdFullName', 'darajahName', 'schoolName', 
            'marhalaCount', 'totalMarhalaCount', 'photoZoom', 'photoYOffset'
        ];
        
        controls.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', draw);
        });

        // Dynamic text drawing with auto-scaling
        function drawText(text, x, y, maxWidth, baseSize, font, isBold, color, align='center') {
            if (!text) return;
            let size = baseSize;
            ctx.save();
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}"`;
            while (maxWidth && ctx.measureText(text).width > maxWidth && size > 12) {
                size--;
                ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}"`;
            }
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function draw() {
            const studentFont = document.getElementById('fontSelect').value;
            const nameColor = document.getElementById('nameColor').value;
            const marhalaColor = document.getElementById('marhalaColor').value;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw static background image
            if (bgImage.complete && bgImage.src) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            // 2. Student Photo (Inside Circular Mask)
            if (studentImage) {
                ctx.save();
                ctx.beginPath(); 
                ctx.arc(POS.photo.x, POS.photo.y, POS.photo.radius, 0, Math.PI * 2); 
                ctx.clip();
                
                const zoom = parseFloat(document.getElementById('photoZoom').value);
                const yOff = parseFloat(document.getElementById('photoYOffset').value);
                const ratio = Math.max((POS.photo.radius * 2) / studentImage.width, (POS.photo.radius * 2) / studentImage.height) * zoom;
                
                ctx.drawImage(
                    studentImage, 
                    POS.photo.x - (studentImage.width * ratio / 2), 
                    POS.photo.y - (studentImage.height * ratio / 2) + yOff, 
                    studentImage.width * ratio, 
                    studentImage.height * ratio
                );
                ctx.restore();
            }

            // Canvas Text Render Settings
            ctx.save();
            ctx.direction = 'rtl';

            // 3. Student Details (Inside middle decorative box)
            const fullName = document.getElementById('stdFullName').value;
            drawText(fullName, POS.stdFullName.x, POS.stdFullName.y, POS.stdFullName.maxWidth, 52, studentFont, true, nameColor, 'center');

            const darajah = document.getElementById('darajahName').value;
            drawText(darajah, POS.darajahName.x, POS.darajahName.y, POS.darajahName.maxWidth, 38, studentFont, false, nameColor, 'center');

            const school = document.getElementById('schoolName').value;
            drawText(school, POS.schoolName.x, POS.schoolName.y, POS.schoolName.maxWidth, 36, studentFont, false, nameColor, 'center');

            // 4. Marhala Title (Inside Ribbon)
            const marhala = document.getElementById('marhalaName').value;
            drawText(marhala, POS.marhalaName.x, POS.marhalaName.y, POS.marhalaName.maxWidth, 65, studentFont, true, marhalaColor, 'center');

            // 5. Counters at Bottom
            const mCount = document.getElementById('marhalaCount').value;
            drawText(mCount, POS.marhalaCount.x, POS.marhalaCount.y, null, 42, staticFont, true, nameColor, 'center');

            const tCount = document.getElementById('totalMarhalaCount').value;
            drawText(tCount, POS.totalCount.x, POS.totalCount.y, null, 42, staticFont, true, nameColor, 'center');

            ctx.restore();
        }

        // Initialize template background on page load
        window.onload = () => {
            bgImage.src = "SBHS_Ikhtebar_Post_3.jpg";
            bgImage.onload = draw;
        };

        document.getElementById('studentUpload').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => { 
                studentImage = new Image(); 
                studentImage.onload = draw; 
                studentImage.src = f.target.result; 
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function download() {
            const link = document.createElement('a');
            link.download = 'Ikhtebar_Post.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
