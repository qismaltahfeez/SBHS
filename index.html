<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikhtebar Post Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #1a5276; --gold: #d4af37; --bg: #1a1a2e; }
        body { font-family: 'Amiri', serif; background: var(--bg); color: #ecf0f1; margin: 0; padding: 20px; display: flex; flex-direction: row-reverse; gap: 30px; justify-content: center; }
        
        .editor-panel { background: #ffffff; color: #2c3e50; padding: 25px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 8px solid var(--gold); height: 90vh; overflow-y: auto; text-align: right; }
        h2, h3 { font-family: 'Aref Ruqaa', serif; text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--gold); border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 15px; }
        .field { margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        
        input[type="text"], select, input[type="file"], input[type="range"], input[type="color"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #bdc3c7; box-sizing: border-box; font-family: 'Amiri'; font-size: 0.95em; }
        input[type="color"] { height: 40px; cursor: pointer; padding: 2px; }
        .inline-group { display: flex; gap: 10px; }
        .inline-group div { flex: 1; }
        .preview-container { text-align: center; position: sticky; top: 20px; }
        canvas { border: 10px solid #fff; box-shadow: 0 15px 45px rgba(0,0,0,0.4); max-width: 500px; height: auto; background: #fff; border-radius: 4px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Aref Ruqaa'; font-weight: bold; background: #27ae60; color: white; font-size: 1.2em; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #219150; }
        @media (max-width: 900px) { body { flex-direction: column; align-items: center; } .editor-panel { width: 90%; height: auto; } }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h2>Post Editor</h2>
        
        <!-- 1. Photo Controls (Fixed Frame, Zoom & Slide Only) -->
        <div class="field">
            <h3>1. Photo Controls</h3>
            <label>Upload Student Photo:</label>
            <input type="file" id="studentUpload" accept="image/*">
            
            <div class="inline-group" style="margin-top:8px;">
                <div>
                    <label>Zoom In / Out</label>
                    <input type="range" id="photoZoom" min="0.5" max="3.0" step="0.05" value="1">
                </div>
                <div>
                    <label>Slide Up / Down</label>
                    <input type="range" id="photoYOffset" min="-500" max="500" value="0">
                </div>
            </div>
        </div>

        <!-- 2. Fixed Position Student Details -->
        <div class="field">
            <h3>2. Full Name & Class</h3>
            <input type="text" id="stdFullName" placeholder="اسم الطالب الكامل">
            <input type="text" id="stdClass" placeholder="الدرجة / الصف" style="margin-top:5px;">
            
            <label style="margin-top:8px;">Font Family & Text Color</label>
            <div class="inline-group">
                <select id="fontSelect">
                    <option value="Amiri">Amiri</option>
                    <option value="Aref Ruqaa">Aref Ruqaa</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Scheherazade New">Scheherazade New</option>
                </select>
                <input type="color" id="nameColor" value="#8b1e1e">
            </div>
        </div>

        <!-- 3. Marhala Ribbon PNG Selection -->
        <div class="field">
            <h3>3. Marhala Ribbon Image</h3>
            <label>Upload Marhala PNG Image:</label>
            <input type="file" id="ribbonPngUpload" accept="image/*">
        </div>

        <!-- 4. Counts -->
        <div class="field">
            <h3>4. Counts</h3>
            <div class="inline-group">
                <div>
                    <label>Marhala Count (Left)</label>
                    <input type="text" id="marhalaCount" placeholder="e.g. 1">
                </div>
                <div>
                    <label>Total Count (Right)</label>
                    <input type="text" id="totalMarhalaCount" placeholder="e.g. 8">
                </div>
            </div>
        </div>

        <button onclick="download()">Download Generated Image</button>
    </div>

    <div class="preview-container">
        <canvas id="canvas" width="1224" height="1776"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let bgImage = new Image();
        let studentImage = null;
        let marhalaOverlayImage = null;

        // FIXED POSITIONS AND DIMENSIONS
        const FIXED = {
            photoX: 612,
            photoY: 580,
            photoRadius: 245,

            nameX: 612,
            nameY: 920,
            classX: 612,
            classY: 990,

            ribbonBoxX: 382,
            ribbonBoxY: 1120,
            ribbonBoxW: 460,
            ribbonBoxH: 110
        };

        const controls = [
            'stdFullName', 'stdClass', 'fontSelect', 'nameColor',
            'marhalaCount', 'totalMarhalaCount', 'photoZoom', 'photoYOffset'
        ];
        
        controls.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', draw);
                el.addEventListener('change', draw);
            }
        });

        // Hardcoded Background Template Loading
        bgImage.onload = draw;
        bgImage.src = "SBHS_Ikhtebar_Post_4.jpg";

        // Student Photo Loader
        document.getElementById('studentUpload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (f) => { 
                    studentImage = new Image(); 
                    studentImage.onload = draw; 
                    studentImage.src = f.target.result; 
                };
                reader.readAsDataURL(file);
            }
        };

        // Ribbon PNG Loader
        document.getElementById('ribbonPngUpload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (f) => { 
                    marhalaOverlayImage = new Image(); 
                    marhalaOverlayImage.onload = draw; 
                    marhalaOverlayImage.src = f.target.result; 
                };
                reader.readAsDataURL(file);
            }
        };

        function drawText(text, x, y, maxWidth, baseSize, font, isBold, color, align='center') {
            if (!text) return;
            let size = baseSize;
            ctx.save();
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}", sans-serif`;
            while (maxWidth && ctx.measureText(text).width > maxWidth && size > 12) {
                size--;
                ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}", sans-serif`;
            }
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function draw() {
            const studentFont = document.getElementById('fontSelect').value;
            const chosenColor = document.getElementById('nameColor').value;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Fixed Background Image Rendering
            if (bgImage && bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            // 2. Student Photo (Fixed Circular Mask with Zoom & Slide)
            if (studentImage && studentImage.complete) {
                ctx.save();
                ctx.beginPath(); 
                ctx.arc(FIXED.photoX, FIXED.photoY, FIXED.photoRadius, 0, Math.PI * 2); 
                ctx.clip();
                
                const zoom = parseFloat(document.getElementById('photoZoom').value);
                const yOff = parseFloat(document.getElementById('photoYOffset').value);
                const ratio = Math.max((FIXED.photoRadius * 2) / studentImage.width, (FIXED.photoRadius * 2) / studentImage.height) * zoom;
                
                ctx.drawImage(
                    studentImage, 
                    FIXED.photoX - (studentImage.width * ratio / 2), 
                    FIXED.photoY - (studentImage.height * ratio / 2) + yOff, 
                    studentImage.width * ratio, 
                    studentImage.height * ratio
                );
                ctx.restore();
            }

            // 3. Proportional Ribbon PNG Rendering (Prevents Stretching)
            if (marhalaOverlayImage && marhalaOverlayImage.complete) {
                ctx.save();
                
                const scale = Math.min(
                    FIXED.ribbonBoxW / marhalaOverlayImage.width, 
                    FIXED.ribbonBoxH / marhalaOverlayImage.height
                );

                const renderWidth = marhalaOverlayImage.width * scale;
                const renderHeight = marhalaOverlayImage.height * scale;

                const renderX = FIXED.ribbonBoxX + (FIXED.ribbonBoxW - renderWidth) / 2;
                const renderY = FIXED.ribbonBoxY + (FIXED.ribbonBoxH - renderHeight) / 2;

                ctx.drawImage(marhalaOverlayImage, renderX, renderY, renderWidth, renderHeight);
                ctx.restore();
            }

            // 4. Fixed Centered Text Rendering
            ctx.save();
            ctx.direction = 'rtl';

            const fullName = document.getElementById('stdFullName').value;
            drawText(fullName, FIXED.nameX, FIXED.nameY, 650, 55, studentFont, true, chosenColor, 'center');

            const className = document.getElementById('stdClass').value;
            drawText(className, FIXED.classX, FIXED.classY, 650, 42, studentFont, false, chosenColor, 'center');

            const mCount = document.getElementById('marhalaCount').value;
            drawText(mCount, 180, 1615, null, 48, studentFont, true, chosenColor, 'center');

            const tCount = document.getElementById('totalMarhalaCount').value;
            drawText(tCount, 1044, 1615, null, 48, studentFont, true, chosenColor, 'center');

            ctx.restore();
        }

        function download() {
            const link = document.createElement('a');
            link.download = 'Ikhtebar_Post.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
