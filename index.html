<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hifz Post Generator - Adjusted Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AL-Kanz';
            src: url('Al-Kanz for Windows.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Kanz-al-Marjaan';
            src: url('Kanz-al-Marjaan.ttf') format('truetype');
        }
        body { 
            font-family: 'Kanz-al-Marjaan', serif; 
            background: #1a1a2e; 
            color: #ecf0f1; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: row; 
            gap: 30px; 
            justify-content: center; 
        }
        .editor-panel { 
            background: #ffffff; 
            color: #2c3e50; 
            padding: 25px; 
            border-radius: 15px; 
            width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border-top: 8px solid #d4af37; 
            height: 95vh; 
            overflow-y: auto; 
        }
        h2 { 
            font-family: 'Kanz-al-Marjaan', serif; 
            text-align: center; 
            color: #1a5276; 
            margin-top: 0; 
        }
        .field { 
            margin-bottom: 12px; 
            border-bottom: 1px solid #f0f0f0; 
            padding-bottom: 8px; 
        }
        label { 
            display: block; 
            font-size: 0.8em; 
            font-weight: bold; 
            margin-bottom: 4px; 
            color: #34495e; 
        }
        input[type="text"], select, input[type="file"], input[type="range"], input[type="color"] { 
            width: 100%; 
            padding: 8px; 
            border-radius: 6px; 
            border: 1px solid #bdc3c7; 
            box-sizing: border-box; 
            font-family: 'Amiri'; 
        }
        input[type="color"] { 
            height: 40px; 
            cursor: pointer; 
            padding: 2px; 
        }
        canvas { 
            border: 10px solid #fff; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.4); 
            max-width: 550px; 
            height: auto; 
            background: #2c3e50; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Aref Ruqaa'; 
            font-weight: bold; 
            background: #27ae60; 
            color: white; 
            font-size: 1.1em; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h2>Post Editor</h2>
        
        <div class="field">
            <label>1. Select Marhala Template</label>
            <select id="templateSelect" onchange="updateBackground()">
                <option value="">-- Select Marhalah --</option>
                <option value="https://lh3.googleusercontent.com/u/0/d/1GKTveSxVxRpu1eEWxFZmNj4uBc5Vd35N">Marhala 1</option>
                <option value="https://lh3.googleusercontent.com/d/119wOoByVcSf5t7OTz9cKasOsf8wKCGw7">Marhala 2</option>
                <option value="https://lh3.googleusercontent.com/d/1S1MWEdOAWY5zGUxFwJudxPIzJej7g-YH">Marhala 3</option>
                <option value="https://lh3.googleusercontent.com/d/19SVxCq61K-h7IL-1zABNaJWi1TLkvufb">Marhala 4</option>
                <option value="https://lh3.googleusercontent.com/d/1bv9EYm9aYMo_F3fPT4atEQFXdd8nAtE5">Marhala 5</option>
                <option value="https://lh3.googleusercontent.com/d/10szobf_63M0WK2iHRgYn77TN08UBQ6Rl">Marhala 6</option>
                <option value="https://lh3.googleusercontent.com/d/1x3V47k1Hq_dzsToYQxyWRb8lPjD_X4TD">Marhala 7</option>
                <option value="https://lh3.googleusercontent.com/d/1cDodMK52jBwrZErQHRE2d9_imyGNR--L">Marhala 8</option>
            </select>
        </div>

        <div class="field">
            <label>2. Marhala Title (Ribbon)</label>
            <input type="text" id="marhalaName" placeholder="e.g. المرحلة الأولى">
        </div>

        <div class="field">
            <label>3. Typography & Color (Names)</label>
            <select id="fontSelect">
                <option value="Amiri">Amiri (Default)</option>
                <option value="Aref Ruqaa">Aref Ruqaa</option>
                <option value="Scheherazade New">Scheherazade New</option>
                <option value="Al-Kanz for Windows">Al-Kanz</option>
                <option value="Kanz-al-Marjaan">Kanz al Marjaan</option>
            </select>
            <label style="font-size: 0.7em; margin-top:5px;">Text Color</label>
            <input type="color" id="nameColor" value="#8b0000">
        </div>

        <div class="field">
            <label>4. Student Details</label>
            <input type="text" id="stdFullName" placeholder="اسم الطالب الكامل">
            <input type="text" id="darajahName" placeholder="الدرجة (Darajah)">
        </div>

        <div class="field">
            <label>5. Counts & Footer Info</label>
            <input type="text" id="marhalaCount" placeholder="Marhala Count (e.g. 1)">
            <input type="text" id="totalMarhalaCount" placeholder="Total Count (e.g. 8)">
        </div>

        <div class="field">
            <label>6. Photo Controls</label>
            <input type="file" id="studentUpload" accept="image/*">
            <input type="range" id="photoZoom" min="0.5" max="3.0" step="0.1" value="1">
            <input type="range" id="photoYOffset" min="-500" max="500" value="0">
        </div>

        <button onclick="download()">Download PNG</button>
    </div>

    <div class="preview-container">
        <canvas id="canvas" width="1224" height="1776"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = new Image();
        let studentImage = null;

        // Position coordinates mapped to the uploaded background design
        const POS = {
            photo: { x: 612, y: 550, radius: 180 },          // Top circular frame
            nameFull: { x: 612, y: 925, maxWidth: 800 },       // Inside upper brown ornamental frame
            darajah: { x: 612, y: 990, maxWidth: 800 },        // Inside upper brown ornamental frame (below name)
            marhala: { x: 612, y: 1195, maxWidth: 650 },       // Inside central ribbon box
            marhalaCount: { x: 130, y: 1670 },                // Bottom-left counter
            totalCount: { x: 1094, y: 1670 }                   // Bottom-right counter
        };

        const staticFont = "Kanz-al-Marjaan"; 

        const controls = [
            'stdFullName', 'darajahName', 'marhalaName', 
            'marhalaCount', 'totalMarhalaCount', 'nameColor', 
            'photoZoom', 'photoYOffset', 'fontSelect'
        ];
        
        controls.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', draw);
        });

        function drawText(text, x, y, maxWidth, baseSize, font, isBold, color, align='center') {
            if (!text) return;
            let size = baseSize;
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}"`;
            while (maxWidth && ctx.measureText(text).width > maxWidth && size > 12) {
                size--;
                ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}"`;
            }
            ctx.fillText(text, x, y);
        }

        function draw() {
            const studentFont = document.getElementById('fontSelect').value;
            const chosenColor = document.getElementById('nameColor').value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw template background
            if (bgImage.complete && bgImage.src) {
                ctx.drawImage(bgImage, 0, 0, 1224, 1776);
            }

            // 1. Round Photo Position (Top Frame)
            if (studentImage) {
                ctx.save();
                ctx.beginPath(); 
                ctx.arc(POS.photo.x, POS.photo.y, POS.photo.radius, 0, Math.PI * 2); 
                ctx.clip();
                
                const zoom = parseFloat(document.getElementById('photoZoom').value);
                const yOff = parseFloat(document.getElementById('photoYOffset').value);
                const ratio = Math.max((POS.photo.radius * 2) / studentImage.width, (POS.photo.radius * 2) / studentImage.height) * zoom;
                
                ctx.drawImage(
                    studentImage, 
                    POS.photo.x - (studentImage.width * ratio / 2), 
                    POS.photo.y - (studentImage.height * ratio / 2) + yOff, 
                    studentImage.width * ratio, 
                    studentImage.height * ratio
                );
                ctx.restore();
            }

            // Canvas Text Settings
            ctx.save();
            ctx.direction = 'rtl';

            // 2. Name inside upper ornamental box
            const fullName = document.getElementById('stdFullName').value;
            drawText(fullName, POS.nameFull.x, POS.nameFull.y, POS.nameFull.maxWidth, 65, studentFont, true, chosenColor, 'center');

            // 3. Darajah inside upper ornamental box
            const darajah = document.getElementById('darajahName').value;
            drawText(darajah, POS.darajah.x, POS.darajah.y, POS.darajah.maxWidth, 45, studentFont, false, chosenColor, 'center');

            // 4. Marhala Name inside central ribbon
            const marhala = document.getElementById('marhalaName').value;
            drawText(marhala, POS.marhala.x, POS.marhala.y, POS.marhala.maxWidth, 70, studentFont, true, chosenColor, 'center');

            // 5. Counters
            const mCount = document.getElementById('marhalaCount').value;
            drawText(mCount, POS.marhalaCount.x, POS.marhalaCount.y, null, 50, staticFont, true, chosenColor, 'center');

            const tCount = document.getElementById('totalMarhalaCount').value;
            drawText(tCount, POS.totalCount.x, POS.totalCount.y, null, 50, staticFont, true, chosenColor, 'center');

            ctx.restore();
        }

        function updateBackground() {
            const url = document.getElementById('templateSelect').value;
            if(url) { 
                bgImage.crossOrigin = "anonymous"; 
                bgImage.src = url; 
                bgImage.onload = draw; 
            }
        }

        document.getElementById('studentUpload').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => { 
                studentImage = new Image(); 
                studentImage.onload = draw; 
                studentImage.src = f.target.result; 
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function download() {
            const link = document.createElement('a');
            link.download = 'Hifz_Post.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
