<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikhtebar Post Generator - Precise Coordinate Adjuster</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Kanz al Marjaan';
            src: url('Kanz-al-Marjaan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Al-Kanz for Windows';
            src: url('Al-Kanz for Windows.ttf') format('truetype');
        }

        :root { --primary: #1a5276; --gold: #d4af37; --bg: #1a1a2e; }
        body { font-family: 'Amiri', serif; background: var(--bg); color: #ecf0f1; margin: 0; padding: 20px; display: flex; flex-direction: row-reverse; gap: 30px; justify-content: center; }
        
        .editor-panel { background: #ffffff; color: #2c3e50; padding: 25px; border-radius: 15px; width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 8px solid var(--gold); height: 95vh; overflow-y: auto; text-align: right; }
        h2, h3 { font-family: 'Aref Ruqaa', serif; text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--gold); border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 15px; }
        .field { margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        
        input[type="text"], select, input[type="file"], input[type="range"], input[type="color"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #bdc3c7; box-sizing: border-box; font-family: 'Amiri'; font-size: 0.95em; }
        input[type="color"] { height: 40px; cursor: pointer; padding: 2px; }
        .inline-group { display: flex; gap: 10px; }
        .inline-group div { flex: 1; }
        .preview-container { text-align: center; position: sticky; top: 20px; }
        canvas { border: 10px solid #fff; box-shadow: 0 15px 45px rgba(0,0,0,0.4); max-width: 500px; height: auto; background: #fff; border-radius: 4px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Aref Ruqaa'; font-weight: bold; background: #27ae60; color: white; font-size: 1.2em; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #219150; }
        @media (max-width: 900px) { body { flex-direction: column; align-items: center; } .editor-panel { width: 90%; height: auto; } }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h2>Post Editor & Fine Tuner</h2>
        
        <!-- 1. Photo Section & Controls -->
        <div class="field">
            <h3>1. Photo & Circle Frame</h3>
            <input type="file" id="studentUpload" accept="image/*">
            
            <div class="inline-group" style="margin-top:8px;">
                <div>
                    <label>Zoom</label>
                    <input type="range" id="photoZoom" min="0.5" max="3.0" step="0.05" value="1">
                </div>
                <div>
                    <label>Y-Offset</label>
                    <input type="range" id="photoYOffset" min="-500" max="500" value="0">
                </div>
            </div>
            
            <div class="inline-group" style="margin-top:8px;">
                <div>
                    <label>Frame Circle X</label>
                    <input type="range" id="photoFrameX" min="100" max="1124" value="612">
                </div>
                <div>
                    <label>Frame Circle Y</label>
                    <input type="range" id="photoFrameY" min="100" max="1500" value="580">
                </div>
                <div>
                    <label>Radius</label>
                    <input type="range" id="photoFrameRadius" min="50" max="400" value="245">
                </div>
            </div>
        </div>

        <!-- 2. Student Details & Controls -->
        <div class="field">
            <h3>2. Full Name & Class</h3>
            <input type="text" id="stdFullName" placeholder="اسم الطالب الكامل">
            <input type="text" id="stdClass" placeholder="الدرجة / الصف" style="margin-top:5px;">
            
            <label style="margin-top:8px;">Font Family & Color</label>
            <div class="inline-group">
                <select id="fontSelect">
                    <option value="Amiri">Amiri</option>
                    <option value="Aref Ruqaa">Aref Ruqaa</option>
                    <option value="Scheherazade New">Scheherazade New</option>
                    <option value="Al-Kanz for Windows">Al-Kanz</option>
                    <option value="Kanz al Marjaan">Kanz al Marjaan</option>
                </select>
                <input type="color" id="nameColor" value="#8b1e1e">
            </div>

            <label style="margin-top:8px;">Full Name Position (X, Y)</label>
            <div class="inline-group">
                <input type="range" id="nameX" min="100" max="1124" value="612">
                <input type="range" id="nameY" min="500" max="1500" value="920">
            </div>

            <label style="margin-top:8px;">Class Position (X, Y)</label>
            <div class="inline-group">
                <input type="range" id="classX" min="100" max="1124" value="612">
                <input type="range" id="classY" min="500" max="1500" value="990">
            </div>
        </div>

        <!-- 3. Ribbon PNG Controls -->
        <div class="field">
            <h3>3. Marhala PNG Ribbon</h3>
            <select id="marhalaPngSelect">
                <option value="">-- Select Marhala PNG --</option>
                <option value="marhala1.png">المرحلة الأولى</option>
                <option value="marhala2.png">المرحلة الثانية</option>
                <option value="marhala3.png">المرحلة الثالثة</option>
                <option value="marhala4.png">المرحلة الرابعة</option>
                <option value="marhala5.png">المرحلة الخامسة</option>
                <option value="marhala6.png">المرحلة السادسة</option>
                <option value="marhala7.png">المرحلة السابعة</option>
                <option value="marhala8.png">المرحلة الثامنة</option>
            </select>

            <label style="margin-top:8px;">Ribbon PNG (X, Y)</label>
            <div class="inline-group">
                <input type="range" id="ribbonX" min="0" max="1000" value="382">
                <input type="range" id="ribbonY" min="500" max="1600" value="1120">
            </div>

            <label style="margin-top:8px;">Ribbon PNG (Width, Height)</label>
            <div class="inline-group">
                <input type="range" id="ribbonW" min="100" max="1000" value="460">
                <input type="range" id="ribbonH" min="20" max="400" value="110">
            </div>
        </div>

        <!-- 4. Marhala Counts -->
        <div class="field">
            <h3>4. Counts (Bottom Left / Right)</h3>
            <div class="inline-group">
                <div>
                    <label>Marhala Count</label>
                    <input type="text" id="marhalaCount" placeholder="Left Count">
                </div>
                <div>
                    <label>Total Count</label>
                    <input type="text" id="totalMarhalaCount" placeholder="Right Count">
                </div>
            </div>
        </div>

        <button onclick="download()">Download PNG</button>
    </div>

    <div class="preview-container">
        <canvas id="canvas" width="1224" height="1776"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let bgImage = new Image();
        let studentImage = null;
        let marhalaOverlayImage = null;

        const staticFont = "Kanz al Marjaan";

        // Collect control elements
        const controls = [
            'stdFullName', 'stdClass', 'fontSelect', 'nameColor',
            'marhalaCount', 'totalMarhalaCount', 'photoZoom', 'photoYOffset',
            'photoFrameX', 'photoFrameY', 'photoFrameRadius',
            'nameX', 'nameY', 'classX', 'classY',
            'ribbonX', 'ribbonY', 'ribbonW', 'ribbonH'
        ];
        
        controls.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', draw);
        });

        document.getElementById('marhalaPngSelect').addEventListener('change', (e) => {
            const src = e.target.value;
            if (src) {
                marhalaOverlayImage = new Image();
                marhalaOverlayImage.crossOrigin = "anonymous";
                marhalaOverlayImage.onload = draw;
                marhalaOverlayImage.src = src;
            } else {
                marhalaOverlayImage = null;
                draw();
            }
        });

        function drawText(text, x, y, maxWidth, baseSize, font, isBold, color, align='center') {
            if (!text) return;
            let size = baseSize;
            ctx.save();
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}"`;
            while (maxWidth && ctx.measureText(text).width > maxWidth && size > 12) {
                size--;
                ctx.font = `${isBold ? 'bold' : ''} ${size}px "${font}"`;
            }
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function draw() {
            const studentFont = document.getElementById('fontSelect').value;
            const chosenColor = document.getElementById('nameColor').value;

            // Canvas parameters read directly from input controls
            const frameX = parseInt(document.getElementById('photoFrameX').value);
            const frameY = parseInt(document.getElementById('photoFrameY').value);
            const frameRadius = parseInt(document.getElementById('photoFrameRadius').value);

            const nX = parseInt(document.getElementById('nameX').value);
            const nY = parseInt(document.getElementById('nameY').value);

            const cX = parseInt(document.getElementById('classX').value);
            const cY = parseInt(document.getElementById('classY').value);

            const rX = parseInt(document.getElementById('ribbonX').value);
            const rY = parseInt(document.getElementById('ribbonY').value);
            const rW = parseInt(document.getElementById('ribbonW').value);
            const rH = parseInt(document.getElementById('ribbonH').value);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw Template Background
            if (bgImage.complete && bgImage.src) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            // 2. Student Photo Frame
            if (studentImage) {
                ctx.save();
                ctx.beginPath(); 
                ctx.arc(frameX, frameY, frameRadius, 0, Math.PI * 2); 
                ctx.clip();
                
                const zoom = parseFloat(document.getElementById('photoZoom').value);
                const yOff = parseFloat(document.getElementById('photoYOffset').value);
                const ratio = Math.max((frameRadius * 2) / studentImage.width, (frameRadius * 2) / studentImage.height) * zoom;
                
                ctx.drawImage(
                    studentImage, 
                    frameX - (studentImage.width * ratio / 2), 
                    frameY - (studentImage.height * ratio / 2) + yOff, 
                    studentImage.width * ratio, 
                    studentImage.height * ratio
                );
                ctx.restore();
            }

            // 3. Marhala PNG Overlay inside Ribbon
            if (marhalaOverlayImage && marhalaOverlayImage.complete) {
                ctx.save();
                ctx.drawImage(marhalaOverlayImage, rX, rY, rW, rH);
                ctx.restore();
            }

            // 4. Dynamic Text Render
            ctx.save();
            ctx.direction = 'rtl';

            // Full Name inside upper box
            const fullName = document.getElementById('stdFullName').value;
            drawText(fullName, nX, nY, 650, 55, studentFont, true, chosenColor, 'center');

            // Class inside upper box below name
            const className = document.getElementById('stdClass').value;
            drawText(className, cX, cY, 650, 42, studentFont, false, chosenColor, 'center');

            // Bottom-Left Marhala Count
            const mCount = document.getElementById('marhalaCount').value;
            drawText(mCount, 180, 1615, null, 48, staticFont, true, chosenColor, 'center');

            // Bottom-Right Total Count
            const tCount = document.getElementById('totalMarhalaCount').value;
            drawText(tCount, 1044, 1615, null, 48, staticFont, true, chosenColor, 'center');

            ctx.restore();
        }

        window.onload = () => {
            bgImage.src = "SBHS_Ikhtebar_Post_4.jpg";
            bgImage.onload = draw;
        };

        document.getElementById('studentUpload').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => { 
                studentImage = new Image(); 
                studentImage.onload = draw; 
                studentImage.src = f.target.result; 
            };
            if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        };

        function download() {
            const link = document.createElement('a');
            link.download = 'Ikhtebar_Post.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
